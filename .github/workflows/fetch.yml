name: Fetch All-Weather Portfolio Data

on:
  # 每天早上8点（北京时间）自动更新
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = 北京时间 8:00
  # 也支持手动触发
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        env:
          LONGPORT_APP_KEY: ${{ secrets.LONGPORT_APP_KEY }}
          LONGPORT_APP_SECRET: ${{ secrets.LONGPORT_APP_SECRET }}
          LONGPORT_ACCESS_TOKEN: ${{ secrets.LONGPORT_ACCESS_TOKEN }}
          OUTPUT_PATH: data/latest.json
        run: |
          python fetch_data.py

      - name: Commit and push data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Auto-update portfolio data ${{ github.event.head_commit.message }}"
          file_pattern: "data/latest.json"
          skip_dirty: false
